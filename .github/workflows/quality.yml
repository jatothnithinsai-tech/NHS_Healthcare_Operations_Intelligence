name: Quality and official-data checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      official_integration:
        description: 'Download official NHS history and validate PostgreSQL (may take several minutes)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check src scripts tests
      - run: python -m pytest tests/unit tests/data_quality -q -p no:cacheprovider --junitxml=reports/validation/ci_unit_tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-evidence
          path: reports/validation/ci_unit_tests.xml
  official-integration:
    if: github.event_name == 'workflow_dispatch' && inputs.official_integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nhs
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: nhs_operations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nhs:ci_ephemeral_only@127.0.0.1:5432/nhs_operations
      NHS_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m src.pipeline --refresh --reports
      - run: python -m scripts.build_powerbi
      - run: python -m pytest -q -p no:cacheprovider --junitxml=reports/validation/ci_integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-integration-evidence
          path: reports/validation/
